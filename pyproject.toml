[project]
name = "ballpark"
version = "0.1.0"
description = "MLB ballparks, Statcast lineups/pitchers, and foul/HR seat-zone projections"
requires-python = ">=3.11,<3.14"
dependencies = ["pandas", "numpy", "requests", "pybaseball", "pyarrow", "matplotlib"]

[project.scripts]
ballpark = "ballpark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ballpark"]
